<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydration & Daily Water Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="tracker-card">
      <!-- Progress Display -->
      <h2 id="progress-display">0 mL / 2000 mL</h2>

      <h1>Hydration & Daily Water Tracker</h1>

      <!-- Button Container -->
      <div id="button-container">
        <button class="add-btn" data-amount="250">+250 mL</button>
        <button class="add-btn" data-amount="500">+500 mL</button>
      </div>
      <button id="reset-btn">Reset Tracker</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
